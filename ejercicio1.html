
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - JavaScript</title>
</head>
<body>

    <h1>Mi primer ejercicio de JavaScript</h1>

    <p id="mensaje"></p>

    <button onclick="cambiarTexto()">
        Cambiar texto
    </button>

    <script>
        function cambiarTexto() {
            document.getElementById("mensaje").textContent =
                "¡Texto actualizado con Javascript!";
        }
    </script>

</body>
</html>
